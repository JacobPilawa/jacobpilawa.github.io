    :root {

      --muted: #696A7C;
      --paper: #FFFFFF;

    * { box-sizing: border-box; }
    html { color: var(--ink); background: var(--paper); font-family: "Poppins", sans-serif; }
    body { margin: 0; min-width: 300px; }
    main { width: min(940px, 100%); margin: 0 auto; padding: 18px 8px 40px; }

    .category-filters { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .round-filters { grid-template-columns: repeat(var(--round-count), minmax(0,1fr)); margin-top: 5px; }
    button { min-height: 40px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: white; font: inherit; font-size: clamp(10px, 2.9vw, 13px); font-weight: 750; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    button[data-category="single"][aria-pressed="true"] { color: white; border-color: var(--navy); background: var(--navy); }
    button[data-category="duo"][aria-pressed="true"] { border-color: var(--pink); background: var(--pink); }
    button[data-category="team"][aria-pressed="true"] { border-color: var(--yellow); background: var(--yellow); }
    button[data-round][aria-pressed="true"] { color: white; border-color: var(--ink); background: var(--ink); }
    .minor-row { display: flex; justify-content: space-between; align-items: center; min-height: 34px; }
    .minor-button { min-height: 30px; padding: 2px 0; border: 0; color: var(--navy); background: transparent; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
    .result-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 400; }
    .count { color: var(--muted); }
    .api-link { color: #0000EE; text-decoration: underline; text-underline-offset: 2px; }
    .puzzles[hidden] { display: none; }
    .puzzles { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px,1fr)); gap: 8px; margin: 6px 0 16px; }
    .puzzles a { min-width: 0; color: var(--ink); font-size: 11px; font-weight: 700; text-align: center; text-decoration: none; }
    .puzzles img { display: block; width: 100%; max-height: 220px; margin-bottom: 4px; object-fit: contain; }
    .chart-wrap { width: 100%; overflow: hidden; }
    svg { display: block; width: 100%; overflow: visible; }
    .axis, .grid { shape-rendering: crispEdges; }
    .axis { stroke: var(--ink); }
    .grid { stroke: var(--line); }
    svg text { fill: var(--ink); font-family: inherit; }
    .tick-label, .axis-title { font-size: 10px; }
    .name-label { font-size: 11px; }
    .value-label { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .source { margin: 8px 0 0; color: var(--muted); font-size: 10px; text-align: right; }
    .empty { margin: 36px 0; color: var(--muted); font-size: 13px; text-align: center; }
    @media (min-width: 700px) { main { padding: 26px 20px 48px; } .name-label { font-size: 12px; } }
  </style>

      const node = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    function formatTime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      const mm = String(minutes).padStart(2, "0");
      const ss = String(secs).padStart(2, "0");
      return hours ? `${hours}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function layoutName(place, name, maxWidth, baseFontSize) {
      const prefix = `${place}. `;
      const full = prefix + name;
      const words = name.trim().split(/\s+/);
      let fontSize = baseFontSize;
      const measure = text => {
        measureContext.font = `${fontSize}px Poppins, sans-serif`;
        return measureContext.measureText(text).width;
      };
      let lines = [full];
      if (measure(full) > maxWidth && words.length > 1) {
        let best = null;
        for (let split = 1; split < words.length; split += 1) {
          const candidate = [prefix + words.slice(0, split).join(" "), words.slice(split).join(" ")];
          const widest = Math.max(...candidate.map(measure));
          if (!best || widest < best.widest) best = {lines:candidate, widest};
        }
        lines = best.lines;
      }
      while (Math.max(...lines.map(measure)) > maxWidth && fontSize > 8.5) fontSize -= .5;
      return {lines, fontSize};
    }

    function roundsForCategory(category) {
      return summary.rounds.filter(round => round.category === category);
    }

    function updatePuzzles() {
      const available = roundsForCategory(activeCategory).filter(round =>
        round.puzzle_image && (activeRound === "all" || round.round_key === activeRound)
      );
      puzzles.replaceChildren();
      puzzles.hidden = true;
      puzzleToggle.hidden = available.length === 0;
      puzzleToggle.setAttribute("aria-expanded", "false");
      puzzleToggle.textContent = "Show puzzle images";
      available.forEach(round => {
        const link = document.createElement("a");
        link.href = round.puzzle_image;
        link.target = "_blank";
        link.rel = "noopener";
        link.setAttribute("aria-label", `View the ${round.round_name} puzzle: ${round.puzzle_name}`);
        const image = document.createElement("img");
        image.src = round.puzzle_image;
        image.alt = `${round.puzzle_name}, the ${round.round_name} puzzle`;
        image.loading = "lazy";
        const label = document.createElement("span");
        label.textContent = `${round.short_name}: ${round.puzzle_name} · ${round.puzzle_brand}`;
        link.append(image, label);
        puzzles.append(link);
      });
    }

    puzzleToggle.addEventListener("click", () => {
      const show = puzzles.hidden;
      puzzles.hidden = !show;
      puzzleToggle.setAttribute("aria-expanded", String(show));
      puzzleToggle.textContent = show ? "Hide puzzle images" : "Show puzzle images";
    });

    function render() {
      const categoryResults = results.filter(row => row.category === activeCategory);
      const visible = activeRound === "all" ? categoryResults : categoryResults.filter(row => row.round_key === activeRound);
      count.textContent = `${visible.length} result${visible.length === 1 ? "" : "s"}`;
      const selectedRound = roundsForCategory(activeCategory).find(round => round.round_key === activeRound);
      apiLink.href = selectedRound?.public_page_url || "https://ranking.puzzled.panique-labs.nl/pjm-2026";
      empty.hidden = visible.length !== 0;
      chartWrap.hidden = visible.length === 0;
      if (!visible.length) return;
      const width = Math.max(300, Math.round(chartWrap.getBoundingClientRect().width));
      const left = width < 500 ? Math.max(112, Math.min(140, Math.round(width * .35))) : 190;
      const right = width < 500 ? 8 : 12;
      const nameFontSize = width < 500 ? 11 : 12;
      const top = 28;
      const bottom = 42;
      const rowHeight = width < 350 ? 25 : width < 500 ? 22 : 24;
      const largestCategoryTime = Math.max(3600, ...categoryResults.map(row => row.elapsed_seconds));
      const maxSeconds = Math.ceil(largestCategoryTime / 1800) * 1800;
      const plotWidth = Math.max(100, width - left - right);
      const plotHeight = Math.max(rowHeight, visible.length * rowHeight);
      const height = top + plotHeight + bottom;
      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("height", height);
      svg.setAttribute("aria-label", `${visible.length} finish times, ordered fastest to slowest`);

      const divisions = width < 500 ? 2 : 4;
      const ticks = Array.from({length:divisions + 1}, (_, index) => maxSeconds * index / divisions);
      ticks.forEach(value => {
        const x = left + value / maxSeconds * plotWidth;
        svg.append(element("line", {x1:x, y1:top, x2:x, y2:top+plotHeight, class:"grid"}));
        const label = element("text", {x, y:top-8, "text-anchor": value === 0 ? "start" : value === maxSeconds ? "end" : "middle", class:"tick-label"});
        label.textContent = formatTime(value);
        svg.append(label);
      });
      svg.append(element("line", {x1:left, y1:top, x2:left+plotWidth, y2:top, class:"axis"}));
      svg.append(element("line", {x1:left, y1:top, x2:left, y2:top+plotHeight, class:"axis"}));

      visible.forEach((row, index) => {
        const place = index + 1;
        const y = top + index * rowHeight + 3;
        const barWidth = Math.max(1, row.elapsed_seconds / maxSeconds * plotWidth);
        const nameLayout = layoutName(place, row.name, left - 9, nameFontSize);
        const nameX = left - 7;
        const name = element("text", {x:nameX, y:y+(rowHeight-6)/2, "text-anchor":"end", "dominant-baseline":"middle", class:"name-label", style:`font-size:${nameLayout.fontSize}px`});
        if (nameLayout.lines.length === 1) {
          name.textContent = nameLayout.lines[0];
        } else {
          const firstLine = element("tspan", {x:nameX, dy:"-.48em"});
          firstLine.textContent = nameLayout.lines[0];
          const secondLine = element("tspan", {x:nameX, dy:"1.05em"});
          secondLine.textContent = nameLayout.lines[1];
          name.append(firstLine, secondLine);
        }
        svg.append(name);
        const title = element("title");
        title.textContent = `Place ${place}: ${row.name} — ${row.round_name} — ${row.finish_time}`;
        const bar = element("rect", {x:left, y, width:barWidth, height:rowHeight-6, fill:row.round_color});
        bar.append(title);
        svg.append(bar);
        const value = element("text", {x:left+barWidth-4, y:y+(rowHeight-6)/2, "text-anchor":"end", "dominant-baseline":"middle", class:"value-label", style:`fill:${row.round_text_color}`});
        value.textContent = formatTime(row.elapsed_seconds);
        svg.append(value);
      });

      const axisTitle = element("text", {x:left+plotWidth/2, y:height-8, "text-anchor":"middle", class:"axis-title"});
      axisTitle.textContent = "Finish time";
      svg.append(axisTitle);
    }

    function buildRoundButtons() {
      const rounds = roundsForCategory(activeCategory);
      roundFilters.replaceChildren();
      roundFilters.style.setProperty("--round-count", rounds.length + 1);
      [{round_key:"all", short_name:"All Rounds"}, ...rounds].forEach(round => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.round = round.round_key;
        button.textContent = round.short_name;
        button.setAttribute("aria-pressed", String(round.round_key === activeRound));
        button.addEventListener("click", () => setRound(round.round_key));
        roundFilters.append(button);
      });
    }

    function setRound(roundKey, updateHash = true) {
      activeRound = roundKey;
      [...roundFilters.querySelectorAll("[data-round]")].forEach(button =>
        button.setAttribute("aria-pressed", String(button.dataset.round === activeRound))
      );
      updatePuzzles();
      render();
      if (updateHash) history.replaceState(null, "", `#${activeCategory}-${activeRound}`);
    }

    function setCategory(category, roundKey = "all", updateHash = true) {
      activeCategory = category;
      const validRounds = new Set(["all", ...roundsForCategory(category).map(round => round.round_key)]);
      activeRound = validRounds.has(roundKey) ? roundKey : "all";
      categoryButtons.forEach(button =>
        button.setAttribute("aria-pressed", String(button.dataset.category === activeCategory))
      );
      buildRoundButtons();
      setRound(activeRound, updateHash);
    }

    categoryButtons.forEach(button => button.addEventListener("click", () => setCategory(button.dataset.category)));

    function syncFromHash() {
      const match = location.hash.match(/^#(single|duo|team)-(all|prelim-[123]|final)$/);
      setCategory(match ? match[1] : "single", match ? match[2] : "all", false);
    }

    syncFromHash();
    window.addEventListener("hashchange", syncFromHash);
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 80);
    });
    if (document.fonts) document.fonts.ready.then(render);
    const collected = new Date(summary.collected_at_utc);
    document.getElementById("source").textContent = `Official results · Updated ${collected.toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}`;
  </script>
</body>
</html>
