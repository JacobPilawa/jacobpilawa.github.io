  <style>
    :root {
      --navy: #2C2E76;
      --pink: #E69593;
      --yellow: #F1B643;
      --ink: #17182F;
      --muted: #696A7C;
      --paper: #FFFFFF;
      --line: #D9DAE3;
    }
    * { box-sizing: border-box; }
    html { color: var(--ink); background: var(--paper); font-family: "Poppins", sans-serif; }
    body { margin: 0; min-width: 300px; }
    main { width: min(940px, 100%); margin: 0 auto; padding: 18px 8px 40px; }
    h1 { margin: 0 0 14px; font-size: clamp(20px, 5vw, 28px); letter-spacing: -.025em; }
    .controls { position: sticky; z-index: 10; top: 0; margin: 0 -4px 10px; padding: 8px 4px; background: rgba(255,255,255,.96); }
    .filters { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 5px; }
    button { min-height: 40px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: white; font: inherit; font-size: clamp(10px, 2.9vw, 13px); font-weight: 750; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    button[data-filter="all"][aria-pressed="true"], button[data-filter="1"][aria-pressed="true"] { color: white; border-color: var(--navy); background: var(--navy); }
    button[data-filter="2"][aria-pressed="true"] { border-color: var(--pink); background: var(--pink); }
    button[data-filter="3"][aria-pressed="true"] { border-color: var(--yellow); background: var(--yellow); }
    .minor-row { display: flex; justify-content: space-between; align-items: center; min-height: 34px; }
    .minor-button { min-height: 30px; padding: 2px 0; border: 0; color: var(--navy); background: transparent; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
    .result-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 400; }
    .count { color: var(--muted); }
    .api-link { color: #0000EE; text-decoration: underline; text-underline-offset: 2px; }
    .puzzles[hidden] { display: none; }
    .puzzles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 6px 0 16px; }
    .puzzles a { min-width: 0; color: var(--ink); font-size: 11px; font-weight: 700; text-align: center; text-decoration: none; }
    .puzzles img { display: block; width: 100%; max-height: 220px; margin-bottom: 4px; object-fit: contain; }
    .chart-wrap { width: 100%; overflow: hidden; }
    svg { display: block; width: 100%; overflow: visible; }
    .axis, .grid { shape-rendering: crispEdges; }
    .axis { stroke: var(--ink); }
    .grid { stroke: var(--line); }
    svg text { fill: var(--ink); font-family: inherit; }
    .tick-label, .axis-title { font-size: 10px; }
    .name-label { font-size: 11px; }
    .value-label { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .source { margin: 8px 0 0; color: var(--muted); font-size: 10px; text-align: right; }
    @media (min-width: 700px) { main { padding: 26px 20px 48px; } .name-label { font-size: 12px; } }
  </style>

    const summary = {"collected_at_utc":"2026-08-15T19:14:36.639684+00:00","competition_id":"019f7652-3968-7176-b00c-49b7deab1bb4","rounds":[{"round_number":1,"round_name":"Individual Preliminary One","entrants":56,"finishers":53,"not_finished":3,"winner":"Mari Black","winning_time":"00:47:39","winning_elapsed_seconds":2859,"puzzle_name":"The Shoppers","puzzle_brand":"Portland Puzzle","puzzle_artist":"Dave Garbot","puzzle_image":"images/prelim_1_puzzle.png","puzzle_image_source":"https://puzzled.speedpuzzling.nl/api/storage/2651/conversions/Individual-Prelim-1---Shoppers-%28without-overlay%29-Medium-small.png"},{"round_number":2,"round_name":"Individual Preliminary Two","entrants":55,"finishers":55,"not_finished":0,"winner":"Iryna Shvydchenko","winning_time":"00:43:33","winning_elapsed_seconds":2613,"puzzle_name":"Tourist Posters","puzzle_brand":"Puzzery","puzzle_artist":"","puzzle_image":"images/prelim_2_puzzle.png","puzzle_image_source":"https://puzzled.speedpuzzling.nl/api/storage/2652/conversions/Individual-Prelim-2---Puzzery-Tourist-Collage-%28without-overlay%29-Medium-small.png"},{"round_number":3,"round_name":"Individual Preliminary Three","entrants":54,"finishers":52,"not_finished":2,"winner":"Hannah Doyle","winning_time":"00:54:01","winning_elapsed_seconds":3241,"puzzle_name":"Dragon Dance","puzzle_brand":"Portland Puzzle","puzzle_artist":"Creator Jazzy","puzzle_image":"images/prelim_3_puzzle.png","puzzle_image_source":"https://puzzled.speedpuzzling.nl/api/storage/2654/conversions/Individual-Prelim-3---Dragon-Dance-%28without-overlay%29-Medium-small.png"}]};
    const colors = {1:"#2C2E76",2:"#E69593",3:"#F1B643"};
    const maxSeconds = 7200;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("chart");
    const chartWrap = document.getElementById("chart-wrap");
    const count = document.getElementById("count");
    const buttons = [...document.querySelectorAll("[data-filter]")];
    const puzzles = document.getElementById("puzzles");
    const puzzleToggle = document.getElementById("puzzle-toggle");
    const measureContext = document.createElement("canvas").getContext("2d");
    let activeFilter = "all";

    function element(name, attributes = {}) {
      const node = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    function formatTime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      const mm = String(minutes).padStart(2, "0");
      const ss = String(secs).padStart(2, "0");
      return hours ? `${hours}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function layoutName(place, name, maxWidth, baseFontSize) {
      const prefix = `${place}. `;
      const full = prefix + name;
      const words = name.trim().split(/\s+/);
      let fontSize = baseFontSize;
      const measure = text => {
        measureContext.font = `${fontSize}px Poppins, sans-serif`;
        return measureContext.measureText(text).width;
      };
      let lines = [full];
      if (measure(full) > maxWidth && words.length > 1) {
        let best = null;
        for (let split = 1; split < words.length; split += 1) {
          const candidate = [prefix + words.slice(0, split).join(" "), words.slice(split).join(" ")];
          const widest = Math.max(...candidate.map(measure));
          if (!best || widest < best.widest) best = {lines:candidate, widest};
        }
        lines = best.lines;
      }
      while (Math.max(...lines.map(measure)) > maxWidth && fontSize > 8.5) fontSize -= .5;
      return {lines, fontSize};
    }

    summary.rounds.forEach(round => {
      const link = document.createElement("a");
      link.href = round.puzzle_image;
      link.target = "_blank";
      link.rel = "noopener";
      link.setAttribute("aria-label", `View the Preliminary ${round.round_number} puzzle: ${round.puzzle_name}`);
      const image = document.createElement("img");
      image.src = round.puzzle_image;
      image.alt = `${round.puzzle_name}, the Preliminary ${round.round_number} puzzle`;
      image.loading = "lazy";
      const label = document.createElement("span");
      label.textContent = `Prelim ${round.round_number}: ${round.puzzle_name} · ${round.puzzle_brand}`;
      link.append(image, label);
      puzzles.append(link);
    });

    puzzleToggle.addEventListener("click", () => {
      const show = puzzles.hidden;
      puzzles.hidden = !show;
      puzzleToggle.setAttribute("aria-expanded", String(show));
      puzzleToggle.textContent = show ? "Hide puzzle images" : "Show puzzle images";
    });

    function render(filter) {
      const visible = filter === "all" ? results : results.filter(row => String(row.round_number) === filter);
      count.textContent = `${visible.length} result${visible.length === 1 ? "" : "s"}`;
      const width = Math.max(300, Math.round(chartWrap.getBoundingClientRect().width));
      const left = width < 500 ? Math.max(132, Math.min(178, Math.round(width * .46))) : 190;
      const right = width < 500 ? 8 : 12;
      const nameFontSize = width < 500 ? 11 : 12;
      const top = 28;
      const bottom = 42;
      const rowHeight = width < 500 ? 22 : 24;
      const plotWidth = Math.max(100, width - left - right);
      const plotHeight = Math.max(rowHeight, visible.length * rowHeight);
      const height = top + plotHeight + bottom;
      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("height", height);
      svg.setAttribute("aria-label", `${visible.length} finish times, ordered fastest to slowest`);

      const ticks = width < 500 ? [0, 3600, 7200] : [0, 1800, 3600, 5400, 7200];
      ticks.forEach(value => {
        const x = left + value / maxSeconds * plotWidth;
        svg.append(element("line", {x1:x, y1:top, x2:x, y2:top+plotHeight, class:"grid"}));
        const label = element("text", {x, y:top-8, "text-anchor": value === 0 ? "start" : value === maxSeconds ? "end" : "middle", class:"tick-label"});
        label.textContent = formatTime(value);
        svg.append(label);
      });
      svg.append(element("line", {x1:left, y1:top, x2:left+plotWidth, y2:top, class:"axis"}));
      svg.append(element("line", {x1:left, y1:top, x2:left, y2:top+plotHeight, class:"axis"}));

      visible.forEach((row, index) => {
        const place = index + 1;
        const y = top + index * rowHeight + 3;
        const barWidth = Math.max(1, row.elapsed_seconds / maxSeconds * plotWidth);
        const nameLayout = layoutName(place, row.name, left - 9, nameFontSize);
        const nameX = left - 7;
        const name = element("text", {x:nameX, y:y+(rowHeight-6)/2, "text-anchor":"end", "dominant-baseline":"middle", class:"name-label", style:`font-size:${nameLayout.fontSize}px`});
        if (nameLayout.lines.length === 1) {
          name.textContent = nameLayout.lines[0];
        } else {
          const firstLine = element("tspan", {x:nameX, dy:"-.48em"});
          firstLine.textContent = nameLayout.lines[0];
          const secondLine = element("tspan", {x:nameX, dy:"1.05em"});
          secondLine.textContent = nameLayout.lines[1];
          name.append(firstLine, secondLine);
        }
        svg.append(name);
        const title = element("title");
        title.textContent = `Place ${place}: ${row.name} — Prelim ${row.round_number} — ${row.finish_time}`;
        const bar = element("rect", {x:left, y, width:barWidth, height:rowHeight-6, fill:colors[row.round_number]});
        bar.append(title);
        svg.append(bar);
        const valueColor = row.round_number === 1 ? "#FFFFFF" : "#17182F";
        const value = element("text", {x:left+barWidth-4, y:y+(rowHeight-6)/2, "text-anchor":"end", "dominant-baseline":"middle", class:"value-label", style:`fill:${valueColor}`});
        value.textContent = formatTime(row.elapsed_seconds);
        svg.append(value);
      });

      const axisTitle = element("text", {x:left+plotWidth/2, y:height-8, "text-anchor":"middle", class:"axis-title"});
      axisTitle.textContent = "Finish time (HH:MM:SS)";
      svg.append(axisTitle);
    }

    function setFilter(filter, updateHash = true) {
      activeFilter = filter;
      buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === filter)));
      render(filter);
      if (updateHash) history.replaceState(null, "", filter === "all" ? location.pathname + location.search : `#prelim-${filter}`);
    }

    buttons.forEach(button => button.addEventListener("click", () => setFilter(button.dataset.filter)));
    const match = location.hash.match(/^#prelim-([123])$/);
    setFilter(match ? match[1] : "all", false);
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => render(activeFilter), 80);
    });
    if (document.fonts) document.fonts.ready.then(() => render(activeFilter));
    const collected = new Date(summary.collected_at_utc);
    document.getElementById("source").textContent = `Official results · Updated ${collected.toLocaleString([], {dateStyle:"medium", timeStyle:"short"})}`;
  </script>
